# Builds the hosted homepage from hosted/reading-list.txt and publishes it to
# GitHub Pages. If a build fails, Pages keeps serving the last good page.
#
# One-time setup in the repo's settings:
#   Secrets and variables > Actions > Secrets:   ANTHROPIC_API_KEY
#   Secrets and variables > Actions > Variables: HOMEPAGE_TZ (optional, e.g. America/Chicago)
#                                                HOMEPAGE_MODEL (optional, e.g. claude-haiku-5-5)
#   Pages > Build and deployment > Source:       GitHub Actions
name: Daily homepage

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC, early morning in the US
  workflow_dispatch:
  push:
    branches: [main]
    paths: [hosted/**]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-homepage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The agent writes "morning" or "evening" editions from the local clock.
      TZ: ${{ vars.HOMEPAGE_TZ || 'America/Chicago' }}
      HOMEPAGE_MODEL: ${{ vars.HOMEPAGE_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2

      # Reuse the agent and environment across runs instead of creating new ones daily.
      - uses: actions/cache@v4
        with:
          path: harness/.agent-state.json
          key: agent-state-${{ github.run_id }}
          restore-keys: agent-state-

      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
